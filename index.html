<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Crypto Exchange | Professional</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0e11; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #181a20; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 400px; border: 1px solid #2b2f36; }
        h2 { font-size: 24px; margin-bottom: 10px; color: #eaecef; }
        p { color: #848e9c; font-size: 14px; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 10px; border: 1px solid #474d57; background: #1e2329; color: white; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #f3ba2f; outline: none; }
        .btn { width: 100%; padding: 14px; background-color: #f3ba2f; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 16px; color: #1e2329; margin-top: 20px; transition: 0.2s; }
        .btn:hover { background-color: #dba321; }
        
        /* Sections */
        #otp-section, #dashboard-section { display: none; }
        .otp-code { font-size: 32px; font-weight: bold; color: #f3ba2f; letter-spacing: 5px; margin: 20px 0; }
        
        /* Dashboard Styling */
        .asset-card { background: #2b2f36; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .price-up { color: #0ecb81; }
    </style>
</head>
<body>

<!-- STEP 1: REGISTRATION -->
<div class="card" id="reg-section">
    <h2>Create Account</h2>
    <p>Get started with your secure crypto wallet.</p>
    <input type="text" id="reg-name" placeholder="Full Name">
    <input type="tel" id="reg-phone" placeholder="Phone Number">
    <input type="email" id="reg-email" placeholder="Email Address">
    <input type="password" id="reg-pass" placeholder="Password">
    <button class="btn" onclick="goToOTP()">Continue</button>
</div>

<!-- STEP 2: OTP GENERATION -->
<div class="card" id="otp-section" style="text-align: center;">
    <h2>Security Verification</h2>
    <p>Please enter the generated code below to verify your identity.</p>
    <div class="otp-code" id="generated-otp">000000</div>
    <input type="text" id="user-otp" placeholder="Enter the 6-digit code" maxlength="6" style="text-align: center;">
    <button class="btn" onclick="verifyOTP()">Verify & Access Dashboard</button>
</div>

<!-- STEP 3: CRYPTO DASHBOARD -->
<div class="card" id="dashboard-section" style="width: 450px;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Wallet Overview</h2>
        <span style="background: #2b2f36; padding: 5px 10px; border-radius: 5px; font-size: 12px;">Live</span>
    </div>
    <p>Total Estimated Balance</p>
    <h1 style="font-size: 36px; margin: 5px 0;">$ 12,450.80 <span style="font-size: 14px; color: #0ecb81;">+5.2%</span></h1>
    
    <div style="margin-top: 25px;">
        <div class="asset-card">
            <span>Bitcoin (BTC)</span>
            <span class="price-up">$64,231.50</span>
        </div>
        <div class="asset-card">
            <span>Ethereum (ETH)</span>
            <span class="price-up">$3,450.12</span>
        </div>
        <div class="asset-card">
            <span>Binance Coin (BNB)</span>
            <span class="price-up">$590.45</span>
        </div>
    </div>
    <button class="btn" style="background: #2b2f36; color: white;" onclick="location.reload()">Sign Out</button>
</div>

<script>
    let currentOTP = "";

    function goToOTP() {
        const name = document.getElementById('reg-name').value;
        if(name === "") { alert("Please fill up all details"); return; }
        
        // Hide Reg, Show OTP
        document.getElementById('reg-section').style.display = 'none';
        document.getElementById('otp-section').style.display = 'block';
        
        // Generate random 6-digit OTP
        currentOTP = Math.floor(100000 + Math.random() * 900000).toString();
        document.getElementById('generated-otp').innerText = currentOTP;
    }

    function verifyOTP() {
        const enteredOTP = document.getElementById('user-otp').value;
        
        if (enteredOTP === currentOTP) {
            // Hide OTP, Show Dashboard
            document.getElementById('otp-section').style.display = 'none';
            document.getElementById('dashboard-section').style.display = 'block';
        } else {
            alert("Invalid OTP code. Please try again.");
        }
    }
</script>

</body>
</html>
