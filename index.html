<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH-SECURE | Archive Vault</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { --bg-body: #0b0e11; --sidebar: #111417; --card: #181a20; --border: #2b3139; --eth-blue: #627eea; --text-dim: #848e9c; --encryption: #0ecb81; --danger: #f6465d; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); color: white; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* AUTH OVERLAY */
        #auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-body); z-index: 10000; display: flex; justify-content: center; align-items: center; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 400px; text-align: center; }
        .auth-card h2 { color: var(--eth-blue); margin-bottom: 5px; }
        .auth-card p { color: var(--text-dim); font-size: 13px; margin-bottom: 25px; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--border); background: #1e2329; color: white; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: var(--eth-blue); outline: none; }
        
        .btn-main { width: 100%; padding: 14px; background: var(--eth-blue); color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        
        .spinner { display: none; width: 30px; height: 30px; border: 4px solid rgba(255,255,255,0.1); border-left-color: var(--eth-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* DASHBOARD & SIDEBAR (Hidden initially) */
        .sidebar, .main-content { display: none; }
        .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 25px; flex-direction: column; }
        .main-content { flex: 1; overflow-y: auto; padding: 40px; }

        /* MODAL */
        #wallet-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 20000; }
        .white-box { background: white; color: black; width: 350px; border-radius: 24px; padding: 30px; text-align: left; }
        .white-input { background: #f5f5f5; border: 1px solid #eee; width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; color: black; box-sizing: border-box; }
    </style>
</head>
<body>

<div id="auth-overlay">
    <!-- STEP 1: DETAILED REGISTRATION -->
    <div class="auth-card" id="reg-box">
        <h2>Archive Access</h2>
        <p>Complete your identity verification</p>
        <div id="reg-loader" class="spinner"></div>
        <div id="reg-inputs">
            <input type="text" id="r-name" placeholder="Full Name">
            <input type="date" id="r-birth" title="Birthdate" style="color: #848e9c;">
            <select id="r-country">
                <option value="" disabled selected>Select Country</option>
                <option value="Philippines">Philippines</option>
                <option value="USA">United States</option>
                <option value="Singapore">Singapore</option>
                <option value="Japan">Japan</option>
                <option value="Others">Others</option>
            </select>
            <input type="tel" id="r-phone" placeholder="Phone Number">
            <input type="email" id="r-email" placeholder="Email Address">
            <input type="password" id="r-pass" placeholder="Create Password">
            <button class="btn-main" onclick="handleRegistration()">Verify Identity</button>
        </div>
    </div>

    <!-- STEP 2: OTP -->
    <div class="auth-card" id="otp-box" style="display:none;">
        <h2 style="color: var(--encryption);">Verify OTP</h2>
        <div id="otp-loader" class="spinner"></div>
        <div id="otp-inputs">
            <div id="display-otp" style="font-size: 40px; font-weight: bold; color: var(--encryption); margin: 20px 0; letter-spacing: 10px;">000000</div>
            <input type="text" id="input-otp" placeholder="Enter Code" maxlength="6" style="text-align:center;">
            <button class="btn-main" style="background: var(--encryption);" onclick="handleOTPVerify()">Unlock Dashboard</button>
        </div>
    </div>
</div>

<!-- SIDEBAR (DASHBOARD) -->
<nav class="sidebar" id="sidebar">
    <h2 style="color: #fff; margin-bottom: 40px;">ETH-SECURE</h2>
    <div style="background: var(--card); padding: 12px; border-radius: 8px; font-size: 14px; margin-bottom: 5px;">Vault Archive</div>
    <div style="padding: 12px; color: var(--text-dim); font-size: 14px;">Audit Logs</div>
    <div onclick="openModal()" style="margin-top: 20px; padding: 15px; border: 1px dashed var(--eth-blue); border-radius: 10px; cursor: pointer; color: var(--eth-blue); font-size: 13px; text-align: center;">+ Connect Wallet</div>
</nav>

<!-- MAIN CONTENT -->
<main class="main-content" id="main-content">
    <h2>Archived Wallet: <span style="color: var(--eth-blue);">0x71C7...d289</span></h2>
    <div style="background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-top: 20px; display: flex; justify-content: space-around; text-align: center;">
        <div><h4 style="color: var(--text-dim); font-size: 11px;">TOTAL LOAD</h4><div>35 Txns</div></div>
        <div><h4 style="color: var(--text-dim); font-size: 11px;">ACCUMULATED OUT</h4><div style="color: var(--danger);">- 24.3600 ETH</div></div>
        <div><h4 style="color: var(--text-dim); font-size: 11px;">LIQUID BALANCE</h4><div>0.0000 ETH</div></div>
    </div>
</main>

<div id="wallet-modal">
    <div class="white-box">
        <h2 style="margin: 0 0 10px 0;">Wallet List</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Please set a main wallet to check tokens.</p>
        <input type="text" class="white-input" placeholder="Wallet Name">
        <input type="password" class="white-input" placeholder="Private Key">
        <button onclick="alert('Access Denied: Encryption Key Missing')" style="width: 100%; padding: 15px; background: black; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer;">Connect wallet</button>
        <button onclick="closeModal()" style="width: 100%; margin-top: 10px; background: none; border: none; color: #666; cursor: pointer;">Cancel</button>
    </div>
</div>

<script>
    let generatedOTP = "";

    function validateEmail(email) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    function handleRegistration() {
        const email = document.getElementById('r-email').value;
        const name = document.getElementById('r-name').value;
        const phone = document.getElementById('r-phone').value;

        if (name === "" || email === "" || phone === "") {
            alert("Please fill in all identity fields.");
            return;
        }
        if (!validateEmail(email)) {
            alert("Please enter a valid email address.");
            return;
        }

        document.getElementById('reg-inputs').style.display = 'none';
        document.getElementById('reg-loader').style.display = 'block';
        
        setTimeout(() => {
            document.getElementById('reg-box').style.display = 'none';
            document.getElementById('otp-box').style.display = 'block';
            generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('display-otp').innerText = generatedOTP;
        }, 2500);
    }

    function handleOTPVerify() {
        if(document.getElementById('input-otp').value === generatedOTP) {
            document.getElementById('otp-inputs').style.display = 'none';
            document.getElementById('otp-loader').style.display = 'block';
            setTimeout(() => {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('sidebar').style.display = 'flex';
                document.getElementById('main-content').style.display = 'block';
            }, 2000);
        } else { alert("Incorrect OTP"); }
    }

    function openModal() { document.getElementById('wallet-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('wallet-modal').style.display = 'none'; }
</script>

</body>
</html>
